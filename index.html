<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Stopwatch & Timer</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:100,300" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="no-select">
    <div class="heading">
      <h1 id="app-title">Stopwatch</h1>
    </div>

    <div class="mode-switcher" role="tablist" aria-label="Time mode">
      <button id="mode-stopwatch" class="mode-btn active" type="button" role="tab" aria-selected="true">Stopwatch</button>
      <button id="mode-timer" class="mode-btn" type="button" role="tab" aria-selected="false">Timer</button>
    </div>

    <section id="stopwatch-mode" class="mode-panel">
      <div class="stopwatch-container">
        <span id="js--stopwatch" class="stopwatch">00:00.00</span>
      </div>
      <div class="actions">
        <button id="js--start" class="btn btn-green u-push-right" type="button">Start</button>
        <button id="js--stop" class="btn btn-red u-push-right u-display-none" type="button">Stop</button>
        <button id="js--reset" class="btn btn-default" type="button" disabled>Reset</button>
      </div>
    </section>

    <section id="timer-mode" class="mode-panel u-display-none">
      <div class="timer-setup" id="timer-setup">
        <label for="timer-minutes">Minutes</label>
        <input id="timer-minutes" type="number" min="0" max="999" value="5" inputmode="numeric" />
        <label for="timer-seconds">Seconds</label>
        <input id="timer-seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
      </div>
      <div class="stopwatch-container timer-container">
        <span id="js--timer" class="stopwatch">05:00</span>
      </div>
      <div class="actions">
        <button id="timer-start" class="btn btn-green u-push-right" type="button">Start</button>
        <button id="timer-pause" class="btn btn-red u-push-right u-display-none" type="button">Pause</button>
        <button id="timer-reset" class="btn btn-default" type="button">Reset</button>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
